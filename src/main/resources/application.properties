spring.application.name=agenda-juridica
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agenda_juridica}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.enabled=true
spring.jackson.time-zone=America/Sao_Paulo

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
app.dashboard.upcoming-days=${APP_DASHBOARD_UPCOMING_DAYS:3}
app.admin.name=${APP_ADMIN_NAME:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
