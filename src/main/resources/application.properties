spring.application.name=agenda-juridica
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/agenda_juridica;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.jackson.time-zone=America/Sao_Paulo

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
app.dashboard.upcoming-days=${APP_DASHBOARD_UPCOMING_DAYS:3}
app.admin.name=${APP_ADMIN_NAME:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
